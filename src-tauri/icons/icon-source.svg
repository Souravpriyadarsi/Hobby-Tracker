<!--
  Master artwork for every app icon.

  The glyph is lucide's "sprout" (the same component the sidebar renders), on the
  mint accent tile, so the window/taskbar/installer icon matches what you see
  inside the app. Regenerate the whole icon set from this file with:

      node scripts/build-icons.mjs

  which rasterises this to 1024x1024 and runs `tauri icon` over it.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="225" ry="225" fill="#6FC3A8" />
  <g
    transform="translate(232 232) scale(23.3333)"
    fill="none"
    stroke="#0D0D0D"
    stroke-width="2.25"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3" />
    <path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4" />
    <path d="M5 21h14" />
  </g>
</svg>
